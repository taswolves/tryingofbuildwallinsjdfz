<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>深圳技术大学附属中学新校墙</title>
        <meta name="og:description" content="深圳技术大学附属中学新校墙">
        <meta name="og:title" content="深圳技术大学附属中学新校墙">
        <meta name="og:keywords" content="深技大附中,新校墙,交流区,校园墙">
        <meta name="og:author" content="Risleo">
        <style>
            .message-item {
                border: 1px solid #ccc;
                margin-bottom: 10px;
                padding: 10px;
            }

            .message-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 10px;
                
            }

            #communicate {
                max-width: 600px;
                margin: 20px auto;
                padding: 20px;
                border: 1px solid #19169e;
                border-radius: 5px;
                opacity: 0.8;
                background-color: rgb(140, 127, 255);
            }

            body {
                background: radial-gradient(circle, #126e75, #ffffff);
            }
            #container {
                width: 80%;
                margin: 0 auto;
                padding: 20px;
                background-color: rgba(255, 255, 255, 0.8);
                border-radius: 10px;
            }
            #btu {
                background-color: #161f9e;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
                display: inline-block;
                animation: floatButton 3s ease-in-out infinite;
            }

            @keyframes floatButton {
                0%, 100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-3px);
                }
            }
        </style>
    </head>
    <body>
        <div id="container">
        <form action="" method="post">
            <div>
                <input type="text" id="name" placeholder="请留下你的名字，没人认得出你"/><br>
            </div>
            <div>
                <label for="message">留言板:</label><br>
                <textarea id="message" name="message" rows="4" cols="50" placeholder="请写下你的看法..."></textarea><br>
                <input id="btu" type="submit" value="提交">
            </div>

        </form>
        </div>
        <section id="messages"></section>
        <script>
            // 本地存储键名
            var STORAGE_KEY = 'sztu_messages';

            var form = document.querySelector('form');
            var messagesEl = document.getElementById('messages');

            function loadMessages() {
                var raw = localStorage.getItem(STORAGE_KEY);
                try {
                    return raw ? JSON.parse(raw) : [];
                } catch (e) {
                    return [];
                }
            }

            function saveMessages(list) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            }

            function createMessageItem(item) {
                var wrapper = document.createElement('div');
                wrapper.className = 'message-item';

                var header = document.createElement('p');
                var strong = document.createElement('strong');
                strong.textContent = item.name + ':';
                header.appendChild(strong);
                header.appendChild(document.createTextNode(' ' + item.message));

                var footer = document.createElement('div');
                footer.className = 'message-footer';

                var timeEl = document.createElement('span');
                timeEl.textContent = new Date(item.time).toLocaleString();
                timeEl.className = 'message-time';

                footer.appendChild(timeEl);
                wrapper.appendChild(header);
                wrapper.appendChild(footer);
                return wrapper;
            }

            function renderMessages() {
                var list = loadMessages();
                messagesEl.innerHTML = '';

                if (list.length === 0) {
                    var empty = document.createElement('p');
                    empty.textContent = '目前还没有留言。欢迎先写一条！';
                    empty.style.color = '#666';
                    messagesEl.appendChild(empty);
                    return;
                }

                list.forEach(function(item) {
                    messagesEl.appendChild(createMessageItem(item));
                });
            }

            form.addEventListener('submit', function(event) {
                event.preventDefault();
                var message = document.getElementById('message').value;
                if (message.trim() === '') {
                    alert('留言不能为空！');
                    return;
                }
                var name = document.getElementById('name').value;
                if (name.trim() === '') {
                    alert('名字不能为空！');
                    return;
                }
                var list = loadMessages();
                list.push({ name: name.trim(), message: message.trim(), time: Date.now() });
                saveMessages(list);
                renderMessages();
                form.reset();
           });

            // 页面加载时恢复留言
            renderMessages();
        </script>
        </div>
        <footer>
            <p>此网站由 <a id="mail" href="mailto:">Risleo</a> 在 SZTUHS 创建。</p>
            <div id="quest">
                <a href="help.html">
                    <svg>
                        <circle id="qu" cx="12" cy="12" r="10" />
                        <text x="12" y="16" text-anchor="middle" font-size="12" >?</text>
                    </svg>
                </a>
            </div>
            <p style="font-size: 8px; color: #ccc;">版本v1.0.0</p>
        </footer>
        <style>
           #quest {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 40px;
                height: 40px;
                cursor: pointer;
                animation: floatButton 3s ease-in-out infinite;
            }
            #qu {
                fill: #2c3333;
            }
            #qu:active {
                fill: #d6d0c9;
            }
            #mail{
                text-decoration: none;
                color: #5bc2c5;
            }
            #mail:hover{
                color: #b97e2f;
            }
            #mail:active{
                color: #19169e;
            }
        </style>
    </body>
</html>
